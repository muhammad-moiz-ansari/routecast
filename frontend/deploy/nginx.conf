pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    # Exclude arguments/headers from logs (location searches may contain private addresses).
    log_format routecast '$remote_addr $request_method $uri $status $request_time';
    access_log /dev/stdout routecast;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    # An aggregate admission limit for this assessment instance, not a provider quota guarantee.
    limit_req_zone $server_name zone=api_budget:10m rate=2r/s;
    server {
        listen 8080;
        # Nonempty constant key makes the instance-wide admission limit apply to every Host.
        server_name _;
        root /usr/share/nginx/html;
        client_max_body_size 32k;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
        location /api/ {
            limit_req zone=api_budget burst=20 nodelay;
            limit_req_status 429;
            # Public TLS ingress must forward original Host; its upstream is private loopback only.
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Connection "";
            proxy_http_version 1.1;
            proxy_connect_timeout 3s;
            proxy_read_timeout 35s;
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
            proxy_cache off;
        }
        location /assets/ { try_files $uri =404; expires 1y; }
        # expires sets cache policy without replacing inherited security add_header directives.
        location = /index.html { expires -1; }
        location = /THIRD_PARTY_NOTICES.txt { try_files $uri =404; }
        location / { try_files $uri /index.html; }
    }
}
